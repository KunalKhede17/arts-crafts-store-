<script>
var percentage = 89;

if (percentage >= 60 && percentage <= 100) {
    document.write("First Division");
}
else if (percentage >= 45 && percentage < 60) {
    document.write("Second Division");
}
else if (percentage >= 33 && percentage < 45) {
    document.write("Third Division");
}
else {
    document.write("Fail");
}
</script>
