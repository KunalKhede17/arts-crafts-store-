<!DOCTYPE html>
<html>
<head>
    <title>jQuery Example</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#btn").click(function () {
                $("#text").hide();
            });
        });
    </script>
</head>
<body>

    <p id="text">This is a jQuery example</p>
    <button id="btn">Hide Text</button>

</body>
</html>
