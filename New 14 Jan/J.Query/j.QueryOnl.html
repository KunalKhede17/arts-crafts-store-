<!DOCTYPE html>
<html>
<head>
    <title>jQuery CDN Example</title>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<button id="btn">Click Me</button>

<script>
$(document).ready(function () {
    $("#btn").click(function () {
        alert("jQuery using CDN");
    });
});
</script>

</body>
</html>
