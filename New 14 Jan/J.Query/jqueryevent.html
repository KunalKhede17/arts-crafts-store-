<!DOCTYPE html>
<html>
<head>
  <title>jQuery Click Event</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script>
  $(document).ready(function(){
    $("#btn").click(function(){
      alert("Button clicked!");
    });
  });
  </script>
</head>
<body>

<button id="btn">Click Me</button>

</body>
</html>
