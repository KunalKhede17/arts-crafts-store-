<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap 5 Typography Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

  <h1 class="text-primary">Bootstrap 5 Heading</h1>
  <h2 class="text-success">Sub Heading</h2>

  <p class="lead">
    This is a lead paragraph in Bootstrap 5.
  </p>

  <p class="text-muted">
    This is muted text.
  </p>

  <p class="fw-bold">
    This text is bold.
  </p>

  <p class="fst-italic">
    This text is italic.
  </p>

  <p class="text-danger text-center">
    Center aligned danger text.
  </p>

  <p class="text-end text-warning">
    Right aligned warning text.
  </p>

</div>

</body>
</html>
