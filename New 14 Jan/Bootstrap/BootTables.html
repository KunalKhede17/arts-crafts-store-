<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap 5 Tables Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

  <h2 class="mb-3">Bootstrap 5 Table Example</h2>

  <div class="table-responsive">
    <table class="table table-striped table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Course</th>
          <th>Marks</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Kunal</td>
          <td>HTML</td>
          <td>100</td>
        </tr>
        <tr>
          <td>2</td>
          <td>kunall</td>
          <td>CSS</td>
          <td>100</td>
        </tr>
        <tr>
          <td>3</td>
          <td>kunalll</td>
          <td>JavaScript</td>
          <td>100</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
