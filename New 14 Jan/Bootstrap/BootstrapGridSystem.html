<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap 5 Grid Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

  <h2 class="text-center mb-4">Bootstrap 5 Grid Example</h2>

  <!-- First Row -->
  <div class="row">
    <div class="col-md-4 bg-primary text-white p-3">
      Column 1 (4/12)
    </div>
    <div class="col-md-4 bg-success text-white p-3">
      Column 2 (4/12)
    </div>
    <div class="col-md-4 bg-danger text-white p-3">
      Column 3 (4/12)
    </div>
  </div>

  <!-- Second Row -->
  <div class="row mt-3">
    <div class="col-md-6 bg-warning p-3">
      Column 1 (6/12)
    </div>
    <div class="col-md-6 bg-info text-white p-3">
      Column 2 (6/12)
    </div>
  </div>

  <!-- Third Row -->
  <div class="row mt-3">
    <div class="col-md-3 bg-secondary text-white p-3">3/12</div>
    <div class="col-md-9 bg-light p-3">9/12</div>
  </div>

</div>

</body>
</html>
